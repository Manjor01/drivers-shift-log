[project]
name = "driver-shift-diary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "uvicorn>=0.29,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx2>=2,<3", "ruff>=0.4", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
